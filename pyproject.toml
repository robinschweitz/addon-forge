[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "addon-forge"
version = "0.1.0"
description = "Local-first WotLK 3.3.5a addon creation and test suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["lupa>=2.2"]  # embedded Lua 5.1 for checks and offline specs

[project.optional-dependencies]
windows = ["Pillow>=10", "keyring>=25", "pywin32>=306"]
linux = ["keyring>=25"]  # Secret Service / KWallet for stored local test-account credentials

[project.scripts]
forge = "addon_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
addon_forge = ["headless/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
