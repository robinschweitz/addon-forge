name: NixOS VM evaluation
on:
  push:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/nixos-eval.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/nixos-eval.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate NixOS VM without booting QEMU
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake check --no-build
          nix --extra-experimental-features 'nix-command flakes' eval --raw .#nixosConfigurations.forge-vm.config.system.build.vm.drvPath
